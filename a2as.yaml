models:
  gemini-2.5-flash:
    type: literal
    agents: [agent.agent, agent.1, agent.2, agent.3]

tools:
  MCPToolset:
    type: mcp
    agents: [agent.agent]
    params:
      class: MCPToolset
      mcp_server: MCPToolset
  MCPToolset.1:
    type: mcp
    agents: [agent.1]
    params:
      class: MCPToolset
      mcp_server: MCPToolset.1
  MCPToolset.2:
    type: mcp
    agents: [agent.2]
    params:
      class: MCPToolset
      mcp_server: MCPToolset.2
  MCPToolset.3:
    type: mcp
    agents: [agent.3]
    params:
      class: MCPToolset
      mcp_server: MCPToolset.3

mcp:
  MCPToolset.0:
    type: network
    url: self.MCP_SERVER_URL
    agents: [agent.GoogleADKMCPFinal.agent, agent.agent]
    params:
      class: MCPToolset
      connection_type: StreamableHTTPServerParams
      instance: MCPToolset
  MCPToolset.1:
    type: network
    url: self.MCP_SERVER_URL
    agents: [agent.GoogleADKMCPFinal.agent.1, agent.1]
    params:
      class: MCPToolset
      connection_type: StreamableHTTPServerParams
  MCPToolset.2:
    type: network
    url: self.MCP_SERVER_URL
    agents: [agent.GoogleADKMCPFinal.agent.2, agent.2]
    params:
      class: MCPToolset
      connection_type: StreamableHTTPServerParams
      tool_filter: self._create_tool_filter()
  MCPToolset.3:
    type: network
    url: self.MCP_SERVER_URL
    agents: [agent.GoogleADKMCPFinal.agent.3, agent.3]
    params:
      class: MCPToolset
      connection_type: StreamableHTTPServerParams
      tool_filter: self._create_tool_filter()

imports:
  Agent: google.adk.agents.Agent
  aiohttp: aiohttp
  Any: typing.Any
  AnyUrl: pydantic.AnyUrl
  asyncio: asyncio
  CORS: flask_cors.CORS
  Dict: typing.Dict
  Flask: flask.Flask
  GoogleADKMCPFinal: google_adk_mcp.GoogleADKMCPFinal
  hashlib: hashlib
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  json: json
  jsonify: flask.jsonify
  logging: logging
  MCPTool: google.adk.tools.mcp_tool.mcp_tool.MCPTool
  MCPToolset: google.adk.tools.mcp_tool.mcp_toolset.MCPToolset
  Optional: typing.Optional
  os: os
  request: flask.request
  RunConfig: google.adk.runners.RunConfig
  Runner: google.adk.runners.Runner
  StreamableHTTPServerParams: google.adk.tools.mcp_tool.mcp_session_manager.StreamableHTTPServerParams
  sys: sys
  time: time
  traceback: traceback
  types: google.genai.types
  uuid: uuid

functions:
  __init__:
    type: sync
    module: agent.python_adk.google_adk_mcp
    args: [self, gemini_api_key, cambrian_api_key]
  _add_conversation_history:
    type: async
    module: agent.python_adk.google_adk_mcp
    args: [self, session_id, conversation_history]
  _create_tool_filter:
    type: sync
    module: agent.python_adk.google_adk_mcp
    args: [self]
  _discover_tools:
    type: async
    module: agent.python_adk.google_adk_mcp
    args: [self]
  _fix_agent_tool_schemas:
    type: sync
    module: agent.python_adk.google_adk_mcp
    args: [self]
    params:
      returns: int
  _fix_tool_schema:
    type: sync
    module: agent.python_adk.google_adk_mcp
    args: [self, schema]
    params:
      returns: Dict
  adk_mcp_json_fix:
    type: sync
    module: agent.python_adk.google_adk_mcp
    args: [self, obj]
  ask:
    type: sync
    module: agent.python_adk.server
  capabilities:
    type: sync
    module: agent.python_adk.server
  filter_invalid_schema_tools:
    type: sync
    module: agent.python_adk.google_adk_mcp
  get_agent:
    type: sync
    module: agent.python_adk.server
  get_capabilities:
    type: sync
    module: agent.python_adk.google_adk_mcp
    args: [self]
    params:
      returns: Dict
  health:
    type: sync
    module: agent.python_adk.server
  initialize:
    type: async
    module: agent.python_adk.google_adk_mcp
    args: [self]
  initialize_with_session:
    type: async
    module: agent.python_adk.google_adk_mcp
    args: [self, session_id]
  normalize:
    type: sync
    module: agent.agent.python_adk.google_adk_mcp
    args: [name]
  process_question:
    type: async
    module: agent.python_adk.google_adk_mcp
    args: [self, question, session_id, conversation_history]
    params:
      returns: Dict

variables:
  CAMBRIAN_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.agent.python_adk.google_adk_mcp, agent.python_adk.google_adk_mcp, agent.python_adk.server]
  GEMINI_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.agent.python_adk.google_adk_mcp, agent.python_adk.google_adk_mcp, agent.python_adk.server]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.environ]
  MCP_SERVER_URL:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.python_adk.google_adk_mcp]
  PYTHON_ADK_HOST:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.python_adk.server]
  PYTHON_ADK_PORT:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.python_adk.server]
  SERVER_CAMBRIAN_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [agent.python_adk.google_adk_mcp, agent.python_adk.server]
